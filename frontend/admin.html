<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f6f9; padding: 20px; }
        table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
        th { background: #7494ec; color: #fff; }
        .btn { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; color: #fff; }
        .btn-toggle { background: #ffa502; }
        .btn-logout { background: #ff4757; float: right; margin-bottom: 20px; }
    </style>
</head>
<body>
    <button class="btn btn-logout" onclick="logout()">Đăng xuất</button>
    <h2>Quản lý người dùng</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th><th>Username</th><th>Email</th><th>Xác thực</th><th>Gói</th><th>Hành động</th>
            </tr>
        </thead>
        <tbody id="user-table-body"></tbody>
    </table>
    <script src="admin.js"></script>
</body>
</html>
