<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mussic Center - Dynamic Web App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #07040d; }
        ::-webkit-scrollbar-thumb { background: #2a1b4e; border-radius: 3px; }
        .glass-panel {
            background: rgba(20, 13, 38, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.12);
        }
    </style>
</head>
<body class="bg-[#05030a] text-slate-100 min-h-screen flex flex-col select-none overflow-hidden">

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-md p-8 rounded-3xl shadow-2xl relative border border-purple-500/30">
            <button onclick="closeAuthModal()" class="absolute top-5 right-5 text-purple-300 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-violet-400 text-white font-bold text-2xl shadow-lg shadow-purple-600/30 mb-3">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <h2 id="authTitle" class="text-2xl font-bold text-white">Đăng nhập Mussic Center</h2>
            </div>
            <form onsubmit="handleAuthServer(event)" class="space-y-4">
                <div id="nameField" class="hidden">
                    <label class="block text-xs font-semibold text-purple-300 mb-1">Họ và tên</label>
                    <input type="text" id="fullNameInput" placeholder="Nhập họ tên" class="w-full bg-[#0d071a] border border-purple-900 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-purple-300 mb-1">Email</label>
                    <input type="email" id="emailInput" required placeholder="name@example.com" class="w-full bg-[#0d071a] border border-purple-900 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-purple-300 mb-1">Mật khẩu</label>
                    <input type="password" id="passwordInput" required placeholder="••••••••" class="w-full bg-[#0d071a] border border-purple-900 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-500">
                </div>
                <button type="submit" id="authSubmitBtn" class="w-full py-3.5 bg-gradient-to-r from-purple-600 to-violet-500 text-white font-bold rounded-xl shadow-lg shadow-purple-600/30">Đăng nhập</button>
            </form>
            <div class="text-center mt-6">
                <button onclick="toggleAuthMode()" id="authToggleText" class="text-sm text-violet-400 hover:underline">Chưa có tài khoản? Đăng ký ngay</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div class="flex flex-1 h-[calc(100vh-90px)] overflow-hidden">
        <aside class="w-64 bg-[#080512] border-r border-purple-950 flex flex-col p-5 space-y-6">
            <div class="flex items-center space-x-3 px-2">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 to-violet-400 flex items-center justify-center text-white font-bold text-lg">
                    <i class="fa-solid fa-music"></i>
                </div>
                <span class="text-xl font-extrabold bg-gradient-to-r from-white via-purple-200 to-violet-400 bg-clip-text text-transparent">Mussic Center</span>
            </div>
            <nav class="space-y-1.5 flex-1">
                <a href="#" class="flex items-center space-x-3.5 px-4 py-3 rounded-xl bg-purple-600/20 text-violet-300 border border-purple-500/30 text-sm font-medium"><i class="fa-solid fa-house w-5"></i><span>Khám phá</span></a>
            </nav>
            <div id="userCard" class="p-4 rounded-2xl bg-[#0d071a] border border-purple-900 flex items-center justify-between">
                <div>
                    <h4 id="userNameDisplay" class="text-sm font-bold text-white">Khách</h4>
                    <p class="text-[11px] text-purple-400">Chưa đăng nhập</p>
                </div>
                <button onclick="openAuthModal('login')" id="authBtn" class="text-xs px-3 py-1.5 bg-purple-600 text-white font-bold rounded-lg">Vào</button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto bg-gradient-to-b from-[#0e081c] to-[#05030a] p-8">
            <!-- Thanh tìm kiếm động -->
            <div class="flex items-center mb-8">
                <div class="relative w-full max-w-md">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-purple-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                    <input type="text" id="searchInput" oninput="fetchSongs(this.value)" placeholder="Tìm kiếm ca sĩ hoặc tên bài hát từ SQL Database..." class="w-full bg-[#100921] border border-purple-900 rounded-2xl py-3 pl-12 pr-4 text-sm text-white focus:outline-none focus:border-purple-500">
                </div>
            </div>

            <!-- Danh sách bài hát từ Server -->
            <h3 class="text-xl font-bold text-white mb-4"><i class="fa-solid fa-compact-disc text-violet-400 mr-2"></i>Thịnh hành từ Server</h3>
            <div id="songListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </main>
    </div>

    <!-- PLAYER -->
    <footer class="h-[90px] bg-[#07040d] border-t border-purple-950 px-6 flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <img id="playerCover" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?auto=format&fit=crop&w=150&q=80" class="w-12 h-12 rounded-xl object-cover">
            <div>
                <h4 id="playerTitle" class="text-sm font-bold text-white">Chọn bài hát</h4>
                <p id="playerArtist" class="text-xs text-purple-300">Mussic Center</p>
            </div>
        </div>
        <div>
            <audio id="audioElement" controls class="h-10 accent-violet-500"></audio>
        </div>
    </footer>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('mussic_user')) || null;
        let isRegister = false;
        let songsData = [];

        window.onload = function() {
            updateUserUI();
            fetchSongs();
        };

        async function fetchSongs(query = '') {
            try {
                let res = await fetch(`http://localhost:3000/api/songs?search=${encodeURIComponent(query)}`);
                let data = await res.json();
                if (data.success) {
                    songsData = data.songs;
                    renderSongs(songsData);
                }
            } catch (err) {
                console.error("Không thể kết nối Backend Server:", err);
            }
        }

        function renderSongs(songs) {
            const container = document.getElementById('songListContainer');
            if (songs.length === 0) {
                container.innerHTML = `<p class="text-purple-400 italic">Không tìm thấy bài hát nào.</p>`;
                return;
            }
            container.innerHTML = songs.map((song, idx) => `
                <div class="glass-panel p-3.5 rounded-2xl flex items-center justify-between">
                    <div class="flex items-center space-x-3 cursor-pointer flex-1" onclick="playSong(${idx})">
                        <img src="${song.cover}" class="w-12 h-12 rounded-xl object-cover">
                        <div>
                            <h4 class="text-sm font-bold text-white">${song.title}</h4>
                            <p class="text-xs text-purple-300"><i class="fa-solid fa-microphone-lines text-[10px] mr-1"></i>${song.artist}</p>
                        </div>
                    </div>
                    <span class="text-xs text-purple-400">${song.duration}</span>
                </div>
            `).join('');
        }

        function playSong(index) {
            const song = songsData[index];
            document.getElementById('playerCover').src = song.cover;
            document.getElementById('playerTitle').innerText = song.title;
            document.getElementById('playerArtist').innerText = song.artist;
            
            const audio = document.getElementById('audioElement');
            audio.src = song.audioUrl;
            audio.play();
        }

        function openAuthModal(mode) {
            isRegister = (mode === 'register');
            document.getElementById('authModal').classList.remove('hidden');
            document.getElementById('nameField').classList.toggle('hidden', !isRegister);
            document.getElementById('authTitle').innerText = isRegister ? "Đăng ký tài khoản" : "Đăng nhập Mussic Center";
            document.getElementById('authSubmitBtn').innerText = isRegister ? "Tạo tài khoản" : "Đăng nhập";
        }

        function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }
        function toggleAuthMode() { openAuthModal(isRegister ? 'login' : 'register'); }

        async function handleAuthServer(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const fullName = document.getElementById('fullNameInput').value;

            const endpoint = isRegister ? '/api/register' : '/api/login';
            const payload = isRegister ? { email, password, fullName } : { email, password };

            try {
                let res = await fetch(`http://localhost:3000${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                let data = await res.json();
                if (data.success) {
                    alert(data.message || "Thành công!");
                    if (!isRegister) {
                        currentUser = data.user;
                        localStorage.setItem('mussic_user', JSON.stringify(currentUser));
                        updateUserUI();
                        closeAuthModal();
                    } else {
                        openAuthModal('login');
                    }
                } else {
                    alert(data.message || "Có lỗi xảy ra!");
                }
            } catch (err) {
                alert("Lỗi kết nối Server!");
            }
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('userNameDisplay').innerText = currentUser.FullName || currentUser.Email;
                document.getElementById('userCard').querySelector('p').innerText = "VIP Server";
                document.getElementById('authBtn').innerText = "Thoát";
                document.getElementById('authBtn').setAttribute('onclick', 'logout()');
            }
        }

        function logout() {
            localStorage.removeItem('mussic_user');
            location.reload();
        }
    </script>
</body>
</html>
