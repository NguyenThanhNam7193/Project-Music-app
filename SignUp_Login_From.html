<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/Signup Form</title>
    <link rel="stylesheet" href="SignUp_LogIn_Form.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .social-icons button {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
        }
        .social-icons a, .social-icons button {
            display: inline-flex;
            padding: 10px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 24px;
            color: #333;
            margin: 0 8px;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .social-icons a:hover, .social-icons button:hover {
            border-color: #7494ec;
            color: #7494ec;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Form Đăng nhập -->
        <div class="form-box login">
            <form id="traditional-login-form">
                <h1>Login</h1>
                <div class="input-box">
                    <input type="text" id="login-username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <div class="forgot-link">
                    <a href="#">Forgot Password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <p>or login with social platforms</p>
                <div class="social-icons">
                    <button type="button" id="btn-google-login"><i class='bx bxl-google' ></i></button>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <button type="button" id="btn-github-login"><i class='bx bxl-github' ></i></button>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>

        <!-- Form Đăng ký -->
        <div class="form-box register">
            <form id="traditional-register-form">
                <h1>Registration</h1>
                <div class="input-box">
                    <input type="text" id="register-username" placeholder="Username" required>
                    <i class='bx bxs-user'></i>
                </div>
                <div class="input-box">
                    <input type="email" placeholder="Email" required>
                    <i class='bx bxs-envelope' ></i>
                </div>
                <div class="input-box">
                    <input type="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt' ></i>
                </div>
                <button type="submit" class="btn">Register</button>
                <p>or register with social platforms</p>
                <div class="social-icons">
                    <button type="button" id="btn-google-reg"><i class='bx bxl-google' ></i></button>
                    <a href="#"><i class='bx bxl-facebook' ></i></a>
                    <button type="button" id="btn-github-reg"><i class='bx bxl-github' ></i></button>
                    <a href="#"><i class='bx bxl-linkedin' ></i></a>
                </div>
            </form>
        </div>

        <!-- Panel chuyển đổi qua lại -->
        <div class="toggle-box">
            <div class="toggle-panel toggle-left">
                <h1>Hello, Welcome!</h1>
                <p>Don't have an account?</p>
                <button type="button" class="btn register-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <h1>Welcome Back!</h1>
                <p>Already have an account?</p>
                <button type="button" class="btn login-btn">Login</button>
            </div>
        </div>
    </div>

    <script src="SignUp_LogIn_Form.js"></script>
</body>
</html>
